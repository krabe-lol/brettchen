name: Build and Push Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t git.krabe.lol/krabe-lol/brettchen:latest .

      - name: Login to registry
        run: docker login -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_PASSWORD }} git.krabe.lol

      - name: Push image
        run: docker push git.krabe.lol/krabe-lol/brettchen:latest
