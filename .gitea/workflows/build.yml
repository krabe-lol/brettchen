name: Build and Push Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: |
          git clone https://git.krabe.lol/krabe-lol/brettchen.git .
          git checkout ${{ github.ref_name }}

      - name: Build Docker image
        run: |
          docker build -t git.krabe.lol/krabe-lol/brettchen:latest .

      - name: Login to Registry
        run: |
          docker login -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_PASSWORD }} git.krabe.lol

      - name: Push image
        run: |
          docker push git.krabe.lol/krabe-lol/brettchen:latest

      - name: Logout
        run: docker logout git.krabe.lol || true
