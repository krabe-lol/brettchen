name: Build and Push CMS Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git curl docker.io

      - name: Clone repository
        run: |
          cd /tmp
          rm -rf brettchen || true
          git clone http://git.krabe.lol/krabe-lol/brettchen.git
          cd brettchen
          git checkout main

      - name: Build Docker image
        run: |
          cd /tmp/brettchen/cms
          docker build -t git.krabe.lol/krabe-lol/brettchen-cms:latest .

      - name: Push to registry
        run: |
          docker login -u krabe.lol -p ${{ secrets.REGISTRY_PASSWORD }} git.krabe.lol
          docker push git.krabe.lol/krabe-lol/brettchen-cms:latest
          docker logout git.krabe.lol || true
