name: Build and Push CMS Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone http://server:3000/krabe-lol/brettchen.git . && git checkout ${{ github.ref_name }}

      - name: Build
        run: docker build -t git.krabe.lol/krabe-lol/brettchen-cms:latest ./cms

      - name: Login
        run: docker login -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_PASSWORD }} git.krabe.lol

      - name: Push
        run: docker push git.krabe.lol/krabe-lol/brettchen-cms:latest
