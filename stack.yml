services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    image: git.krabe.lol/krabe-lol/brettchen-cms:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Läuft hinter HTTPS im Deploy (anders als lokal) - daher hier Default "true", nicht "false" wie in docker-compose.yml.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Muss die tatsächliche Frontend-URL sein (siehe cms/config/middlewares.ts) - sonst blockiert CORS den Login.
      CLIENT_URL: ${CLIENT_URL}
      # SMTP für "Passwort vergessen" (siehe cms/config/plugins.ts) - ohne SMTP_HOST bleibt
      # das Versenden ein No-op statt eines Fehlers.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    ports:
      - "5001:1337"

  frontend:
    # VITE_STRAPI_URL is baked in at build time by the Gitea Action (see
    # .gitea/workflows/build.yml), not at deploy time - Vite compiles it
    # straight into the JS bundle, so it can't be an env var here.
    image: git.krabe.lol/krabe-lol/brettchen:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - strapi
    ports:
      # Not 80:80 - Nginx Proxy Manager already owns host port 80/443,
      # so the frontend gets its own host port and NPM forwards to it.
      - "5000:80"

volumes:
  postgres-data:
  strapi-uploads:
