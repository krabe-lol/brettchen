server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (Data Router, Browser-Historie): unbekannte Pfade an
    # index.html durchreichen, damit clientseitiges Routing greift statt
    # eines nginx-404 bei z. B. einem Reload auf /pattern/xyz.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
